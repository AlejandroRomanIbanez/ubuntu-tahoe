name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  shell-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks and tests
        run: ./tests/run.sh
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: .
