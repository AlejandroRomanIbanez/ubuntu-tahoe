name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  shell-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      - name: Offline tests and ShellCheck
        run: ./tests/run.sh
